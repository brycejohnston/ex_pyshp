name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('mix.lock', 'config/config.exs') }}
      - name: Install independent shapefile reader
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --force --warnings-as-errors
      - run: mix credo --strict
      - run: MIX_ENV=test mix compile --force --warnings-as-errors
      - run: mix test --warnings-as-errors
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
      - run: mix hex.audit
